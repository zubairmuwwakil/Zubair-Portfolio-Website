name: Validate portfolio pull requests

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify pre-rendered production build
        run: npm run build:ssg
      - name: Check new ventures page and sitemap
        run: |
          test -s dist/ventures/index.html
          test -s dist/sitemap.xml
          grep -q 'Zemi Echelon' dist/ventures/index.html
          grep -q 'Echelon Community Athletics' dist/ventures/index.html
          grep -q 'https://zubairmuwwakil.com/ventures/' dist/sitemap.xml
      - name: Verify personal story and interview journey
        run: |
          set -eu
          test -s dist/story/index.html
          test -s dist/interview-journey/index.html
          grep -q 'The life I planned' dist/story/index.html
          grep -q 'built that just for me' dist/story/index.html
          grep -q 'Bloomberg' dist/interview-journey/index.html
          grep -q 'TELUS' dist/interview-journey/index.html
          grep -q 'https://zubairmuwwakil.com/story/' dist/sitemap.xml
          grep -q 'https://zubairmuwwakil.com/interview-journey/' dist/sitemap.xml
      - name: Verify the growth timeline
        run: |
          set -eu
          test -s dist/growth/index.html
          grep -q 'The work between the rejections' dist/growth/index.html
          grep -q 'PickMe' dist/growth/index.html
          grep -q 'https://zubairmuwwakil.com/growth/' dist/sitemap.xml
      - name: Verify source-backed flagship proof pages
        run: |
          set -eu
          for slug in pickleops marketlens inunity; do
            page="dist/projects/$slug/index.html"
            test -s "$page"
            grep -q 'The problem, the build, and the proof' "$page"
            grep -q 'Check the evidence yourself' "$page"
          done
          grep -q 'replay-safe-sync' dist/projects/pickleops/index.html
          grep -q 'Shipped iOS app' dist/projects/pickleops/index.html
          grep -q 'PriceHonestyTest.java' dist/projects/marketlens/index.html
          grep -q 'Purchase matching tests' dist/projects/inunity/index.html
          grep -q 'Three projects that show how I work' dist/projects/index.html
